# Configuración base. Todo secreto llega por variables de entorno; no hay valores por
# defecto para credenciales, de modo que un despliegue mal configurado falla al arrancar.
spring:
  application:
    name: billing-platform
  threads:
    virtual:
      enabled: true
  datasource:
    # La aplicación SIEMPRE se conecta como billing_app (sin ownership ni BYPASSRLS).
    url: ${BILLING_DB_URL}
    username: ${BILLING_DB_APP_USER:billing_app}
    password: ${BILLING_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${BILLING_DB_POOL_SIZE:10}
  flyway:
    # Las migraciones corren como el dueño del esquema, con credenciales distintas.
    url: ${BILLING_DB_URL}
    user: ${BILLING_DB_OWNER_USER:billing_owner}
    password: ${BILLING_DB_OWNER_PASSWORD}
    placeholders:
      app_role: ${BILLING_DB_APP_USER:billing_app}
  jackson:
    default-property-inclusion: non_null

billing:
  security:
    # Secreto HS256 de los access tokens: base64 de al menos 32 bytes aleatorios.
    # Generar: openssl rand -base64 48
    jwt-secret: ${BILLING_JWT_SECRET}
    auth-requests-per-minute: ${BILLING_AUTH_REQUESTS_PER_MINUTE:10}

server:
  # Detrás de nginx/Caddy: la IP del cliente sale de X-Forwarded-For, que Tomcat solo acepta
  # cuando la conexión viene de una red interna (proxies de confianza). Sin esto, el límite por
  # IP trataría a todos los usuarios como una sola dirección: la del proxy.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
