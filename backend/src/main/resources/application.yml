# Configuración base. Todo secreto llega por variables de entorno; no hay valores por
# defecto para credenciales, de modo que un despliegue mal configurado falla al arrancar.
spring:
  application:
    name: billing-platform
  threads:
    virtual:
      enabled: true
  datasource:
    # La aplicación SIEMPRE se conecta como billing_app (sin ownership ni BYPASSRLS).
    url: ${BILLING_DB_URL}
    username: ${BILLING_DB_APP_USER:billing_app}
    password: ${BILLING_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${BILLING_DB_POOL_SIZE:10}
  flyway:
    # Las migraciones corren como el dueño del esquema, con credenciales distintas.
    url: ${BILLING_DB_URL}
    user: ${BILLING_DB_OWNER_USER:billing_owner}
    password: ${BILLING_DB_OWNER_PASSWORD}
    placeholders:
      app_role: ${BILLING_DB_APP_USER:billing_app}
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${BILLING_SMTP_HOST:}
    port: ${BILLING_SMTP_PORT:587}
    username: ${BILLING_SMTP_USERNAME:}
    password: ${BILLING_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${BILLING_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${BILLING_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${BILLING_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

billing:
  security:
    # Secreto HS256 de los access tokens: base64 de al menos 32 bytes aleatorios.
    # Generar: openssl rand -base64 48
    jwt-secret: ${BILLING_JWT_SECRET}
    # Llave maestra de los secretos de cada organización (AES-256-GCM): Base64 de 32 bytes.
    secrets-key: ${BILLING_SECRETS_KEY}
    auth-requests-per-minute: ${BILLING_AUTH_REQUESTS_PER_MINUTE:10}
  web:
    # Dirección pública de la interfaz: con ella se arman los enlaces de los correos.
    base-url: ${BILLING_WEB_BASE_URL:http://localhost:3000}
  brand:
    name: ${BILLING_BRAND_NAME:Billing Platform}
  mail:
    # smtp (producción), log (por omisión: no envía) o memory (pruebas).
    mode: ${BILLING_MAIL_MODE:log}
    from: ${BILLING_MAIL_FROM:no-responder@localhost}
  mercadopago:
    # Pago de NUESTROS planes (ADR-0024). Sin access token, el pago en línea queda deshabilitado.
    access-token: ${BILLING_MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${BILLING_MERCADOPAGO_WEBHOOK_SECRET:}
    # En producción solo un pago real (live_mode) activa un plan. En pruebas con credenciales de prueba: false.
    require-live-mode: ${BILLING_MERCADOPAGO_REQUIRE_LIVE_MODE:true}
  subscriptions:
    # Días después del fin del periodo antes de pasar a PAST_DUE (no emite hasta pagar).
    grace-days: ${BILLING_SUBSCRIPTION_GRACE_DAYS:3}
  legal:
    # Versión de los textos legales vigentes. Mientras estén en revisión del abogado, son borradores.
    terms-version: ${BILLING_TERMS_VERSION:borrador-2026-11}
    privacy-version: ${BILLING_PRIVACY_VERSION:borrador-2026-11}

server:
  # Detrás de nginx/Caddy: la IP del cliente sale de X-Forwarded-For, que Tomcat solo acepta
  # cuando la conexión viene de una red interna (proxies de confianza). Sin esto, el límite por
  # IP trataría a todos los usuarios como una sola dirección: la del proxy.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    # El correo no define si la aplicación está viva: un SMTP caído no debe reiniciarla.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
