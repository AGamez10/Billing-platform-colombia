name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilación + pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"

      # Convierte errores de compilación y pruebas fallidas en anotaciones del check,
      # legibles por la API de GitHub sin descargar logs.
      - name: Anotar fallos
        if: failure()
        run: |
          grep -E '^\[ERROR\] .+\.java:\[[0-9]+,[0-9]+\]' build.log | head -50 \
            | sed -E 's#^\[ERROR\] (.*/)?(src/[^:]+\.java):\[([0-9]+),[0-9]+\] (.*)$#::error file=backend/\2,line=\3::\4#' || true
          grep -E '^\[ERROR\] (Failed to execute goal|Non-resolvable|.*Could not resolve)' build.log | head -10 \
            | sed -E 's#^\[ERROR\] (.*)$#::error title=Maven::\1#' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('target/surefire-reports/TEST-*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = case.find(kind)
                      if el is not None:
                          msg = (el.get('message') or el.text or '').strip().replace('\n', ' ')[:500]
                          print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

      - name: Resumen de pruebas
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0; classes = 0
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              r = ET.parse(path).getroot(); classes += 1
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
          print(f"::notice title=Pruebas::{t} pruebas en {classes} clases; fallidas {f}; errores {e}; omitidas {s}")
          PY

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: Base de datos (migraciones + aislamiento multi-tenant)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - name: Migraciones y pruebas SQL
        run: backend/src/test/sql/run.sh
      - name: Anotar fallos
        if: failure()
        run: |
          grep -E '^(FAIL|psql:.*ERROR)' "${TMPDIR:-/tmp}/tenant_isolation_test.log" 2>/dev/null \
            | sed -E 's#^(.*)$#::error title=SQL::\1#' || true

  frontend:
    name: Interfaz web (tipos + pruebas + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar (lockfile obligatorio, sin scripts de dependencias no revisadas)
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck 2>&1 | tee typecheck.log; exit "${PIPESTATUS[0]}"

      - name: Pruebas
        run: pnpm test 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"

      - name: Build de producción
        run: pnpm build

      - name: Vulnerabilidades conocidas (dependencias de producción, severidad alta o crítica)
        run: pnpm audit --prod --audit-level high

      - name: Anotar fallos
        if: failure()
        run: |
          grep -E 'error TS[0-9]+' typecheck.log 2>/dev/null | head -30 \
            | sed -E 's#^(src/[^(]+)\(([0-9]+),[0-9]+\): (.*)$#::error file=frontend/\1,line=\2::\3#' || true
          grep -E '(FAIL|AssertionError|Error:|×)' test.log 2>/dev/null | head -30 | sed -E 's#^(.*)$#::error title=Vitest::\1#' || true

      - name: Resumen
        if: success()
        run: |
          summary=$(grep -E 'Tests +[0-9]+' test.log | tail -1 | sed -E 's/\x1b\[[0-9;]*m//g' | xargs)
          echo "::notice title=Interfaz::$summary; build OK"

  docker:
    name: Docker (imagen + docker compose de punta a punta)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Levantar el stack
        # Las pruebas de navegador registran varias organizaciones desde una sola IP.
        run: BILLING_AUTH_REQUESTS_PER_MINUTE=200 docker compose up -d --build

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then echo "listo en ${i}x5s"; exit 0; fi
            sleep 5
          done
          echo "::error title=Docker::El backend no respondió en 5 minutos"
          exit 1

      - name: Interfaz web servida por nginx con la API en el mismo origen
        run: |
          set -e
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:3000/facturas/nueva | grep -q '<div id="root">'   # rutas de la SPA
          curl -fsS http://127.0.0.1:3000/manifest.webmanifest | grep -q '"display": "standalone"'
          curl -fsS http://127.0.0.1:3000/api/v1/public/plans | grep -q '"code":"MICRO"'     # proxy a la API
          headers=$(curl -fsSI http://127.0.0.1:3000/)
          echo "$headers" | grep -qi "content-security-policy: default-src 'self'" || { echo "::error title=Web::falta CSP"; exit 1; }
          echo "$headers" | grep -qi "x-content-type-options: nosniff" || { echo "::error title=Web::falta nosniff"; exit 1; }
          echo "$headers" | grep -qi "frame-ancestors 'none'" || { echo "::error title=Web::la app se puede incrustar"; exit 1; }
          user=$(docker compose exec -T web id -un)
          [ "$user" != "root" ] || { echo "::error title=Web::nginx corre como root"; exit 1; }
          echo "::notice title=Web::Interfaz, rutas SPA, manifest PWA, proxy /api y cabeceras de seguridad OK"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Navegador real contra el stack (escritorio y celular)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          CAPTURE=1 pnpm e2e 2>&1 | tee e2e.log; status="${PIPESTATUS[0]}"
          if [ "$status" != "0" ]; then
            grep -E '(✘|Error:|expect\()' e2e.log | head -30 | sed -E 's#^(.*)$#::error title=Playwright::\1#'
            exit "$status"
          fi
          echo "::notice title=E2E::$(grep -E '[0-9]+ passed' e2e.log | tail -1 | xargs)"

      - name: Capturas de pantalla para revisión de diseño (en el registro del job)
        if: always()
        working-directory: frontend
        run: |
          for f in capturas/*.jpg; do
            [ -f "$f" ] || continue
            echo "=== CAPTURA $(basename "$f")"
            base64 -w0 "$f"
            echo
            echo "=== FIN"
          done

      - name: Verificar endpoints públicos y cierre por defecto
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/ | grep -q "Billing Platform Colombia"
          curl -fsS http://127.0.0.1:8080/api/v1/public/plans | grep -q '"code":"MICRO"'
          curl -fsS http://127.0.0.1:8080/api/v1/public/tax-rates | grep -q '"code":"IVA_19"'
          curl -fsS http://127.0.0.1:8080/v3/api-docs > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/env)
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then echo "::error title=Docker::/actuator/env respondió $code"; exit 1; fi
          user=$(docker compose exec -T backend id -un)
          [ "$user" = "app" ] || { echo "::error title=Docker::el contenedor corre como $user"; exit 1; }
          # Registro + sesión de punta a punta dentro del stack de Docker
          body='{"organizationName":"Fundación CI","identificationType":"NIT","identificationNumber":"800197268","checkDigit":4,"fullName":"CI","email":"ci@example.com","password":"caballo bateria grapa","acceptedTermsVersion":"borrador-2026-11","acceptedPrivacyVersion":"borrador-2026-11"}'
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/v1/auth/register | python3 -c "import json,sys;print(json.load(sys.stdin)['accessToken'])")
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/v1/auth/me | grep -q '"role":"OWNER"'
          echo "::notice title=Docker::Stack completo arriba: página de estado, planes, tarifas, OpenAPI, registro y sesión; contenedor sin root"

      - name: Anotar fallos
        if: failure()
        run: |
          docker compose logs --no-color backend 2>&1 | grep -E 'ERROR|Exception|Caused by' | head -20 \
            | sed -E 's#^(.*)$#::error title=Backend log::\1#' || true
          docker compose logs --no-color web 2>&1 | grep -E 'error|emerg' | head -10 \
            | sed -E 's#^(.*)$#::error title=Web log::\1#' || true
          docker compose logs --no-color postgres 2>&1 | grep -E 'ERROR|FATAL' | head -10 \
            | sed -E 's#^(.*)$#::error title=Postgres log::\1#' || true

      - name: Apagar
        if: always()
        run: docker compose down -v

  deploy-kit:
    name: Kit de producción (HTTPS, copia cifrada y restauración)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v5

      - name: Revisar los scripts (shellcheck)
        run: (cd scripts && shellcheck -x ./*.sh) && shellcheck ../infrastructure/postgres/docker-entrypoint-initdb.d/*.sh

      - name: Construir las imágenes como las publicaría el flujo Release
        run: |
          tag="sha-${GITHUB_SHA::7}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build -q -t "ghcr.io/agamez10/billing-platform-backend:$tag" ../backend
          docker build -q --build-arg VITE_BRAND_NAME="Marca CI" -t "ghcr.io/agamez10/billing-platform-web:$tag" ../frontend
          sudo apt-get install -y -qq age >/dev/null

      - name: Preparar el .env como en el servidor
        run: |
          scripts/init-secrets.sh
          scripts/init-secrets.sh > "$RUNNER_TEMP/again.txt"
          grep -q "ya tiene valor: se conserva" "$RUNNER_TEMP/again.txt"   # idempotente: nunca rota secretos
          [ "$(stat -c '%a' .env)" = "600" ]
          age-keygen -o "$RUNNER_TEMP/backup-key.txt" 2>/dev/null
          recipient=$(age-keygen -y "$RUNNER_TEMP/backup-key.txt")
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; grep -q "^$1=" .env || echo "$1=$2" >> .env; }
          set_env BILLING_DOMAIN localhost
          set_env ACME_EMAIL ci@example.com
          set_env BILLING_BRAND_NAME "Marca CI"
          set_env BILLING_MAIL_FROM ci@example.com
          set_env BILLING_MAIL_MODE log
          set_env BACKUP_AGE_RECIPIENT "$recipient"

      - name: Desplegar (HTTPS con Caddy en localhost)
        run: BILLING_SKIP_PULL=1 scripts/deploy.sh "$TAG"

      - name: Verificar HTTPS, cabeceras y rutas cerradas
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          [ "$code" = "308" ] || { echo "::error title=Caddy::HTTP debería redirigir a HTTPS (dio $code)"; exit 1; }
          headers=$(curl -ksSI https://localhost/)
          echo "$headers" | grep -qi "strict-transport-security: max-age=31536000" || { echo "::error title=Caddy::falta HSTS"; exit 1; }
          echo "$headers" | grep -qi "content-security-policy: default-src 'self'" || { echo "::error title=Caddy::falta CSP"; exit 1; }
          code=$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/actuator/health)
          [ "$code" = "404" ] || { echo "::error title=Caddy::/actuator expuesto ($code)"; exit 1; }
          curl -ksS https://localhost/api/v1/public/municipalities | grep -q '"code":"11001"'
          if docker compose --project-directory . -f compose.prod.yml port postgres 5432 2>/dev/null | grep -qE ':[1-9][0-9]*$'; then
            echo "::error title=Producción::PostgreSQL tiene un puerto publicado"; exit 1
          fi
          body='{"organizationName":"Fundación Copia","identificationType":"NIT","identificationNumber":"800197268","checkDigit":4,"fullName":"CI","email":"copia@example.com","password":"caballo bateria grapa","acceptedTermsVersion":"borrador-2026-11","acceptedPrivacyVersion":"borrador-2026-11"}'
          curl -ksS -f -X POST -H 'Content-Type: application/json' -d "$body" https://localhost/api/v1/auth/register > /dev/null
          echo "::notice title=Producción::HTTPS, redirección, HSTS, CSP, actuator cerrado, PostgreSQL sin puerto y registro por el dominio OK"

      - name: Copia cifrada y prueba de restauración
        run: |
          set -e
          scripts/backup.sh ci
          file=$(ls -t backups/*.dump.age | head -1)
          other=$(mktemp -d)/otra.txt; age-keygen -o "$other" 2>/dev/null
          if age --decrypt -i "$other" "$file" > /dev/null 2>&1; then echo "::error title=Copias::se leyó sin la llave"; exit 1; fi
          scripts/restore-check.sh "$file" "$RUNNER_TEMP/backup-key.txt" | tee restore.log
          grep -q "1 organizaciones" restore.log
          echo "::notice title=Copias::$(tail -1 restore.log)"

      - name: Actualizar con copia previa (mismo flujo que una versión nueva)
        run: |
          BILLING_SKIP_PULL=1 scripts/deploy.sh "$TAG"
          ls backups | grep -q "pre-$TAG"

      - name: Anotar fallos
        if: failure()
        run: |
          docker compose --project-directory . -f compose.prod.yml logs --no-color --tail 60 backend caddy 2>&1 \
            | grep -Ei 'error|exception|caused by' | head -20 | sed -E 's#^(.*)$#::error title=Producción log::\1#' || true

      - name: Apagar
        if: always()
        run: docker compose --project-directory . -f compose.prod.yml down -v || true
