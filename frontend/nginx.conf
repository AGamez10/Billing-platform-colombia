# Sirve la interfaz (SPA) y pasa /api al backend por la red interna de Docker.
# Mismo origen para interfaz y API: la cookie de sesión (SameSite=Strict, Path=/api/v1/auth)
# funciona sin CORS. En producción, el proxy con HTTPS va delante de este contenedor.
# Detrás de Caddy (producción) la conexión llega por HTTP interno: se conserva el esquema que
# informa el proxy; sin proxy (local), el propio.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Documentación interactiva de la API (útil en local; en producción la apaga el backend).
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---------- SEO (ADR-0038) ----------
    # La raíz llega con la página pública ya dibujada (prerenderizada en el build). El dominio de
    # las URL canónicas y de Open Graph se pone aquí, al servirla: la imagen no depende del dominio.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '__SITE_URL__' '$forwarded_proto://$host';
        try_files /landing.html /index.html;
    }

    location = /landing.html {
        return 301 /;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nDisallow: /documento\n\nSitemap: $forwarded_proto://$host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/xml;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>$forwarded_proto://$host/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url><url><loc>$forwarded_proto://$host/registro</loc><priority>0.8</priority></url><url><loc>$forwarded_proto://$host/terminos</loc><priority>0.3</priority></url><url><loc>$forwarded_proto://$host/privacidad</loc><priority>0.3</priority></url></urlset>\n';
    }

    # Páginas públicas de la app que sí se pueden indexar.
    location ~ ^/(registro|entrar|terminos|privacidad)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Archivos públicos (íconos, imagen para redes, manifiesto).
    location ~ ^/(icons/|og\.png$|manifest\.webmanifest$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # El resto es la app con sesión o un documento compartido: nunca en buscadores.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
