# Cabeceras de seguridad (OWASP). Se incluyen en cada location que define cabeceras propias,
# porque nginx no hereda add_header del server cuando la location tiene alguna.
# CSP sin 'unsafe-inline' para scripts (los datos estructurados JSON-LD no se ejecutan).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
