# Entorno LOCAL completo: PostgreSQL + backend (con página de estado y documentación de la API).
#
#   cp .env.example .env      # opcional: cambia las contraseñas
#   docker compose up --build
#   → http://localhost:8080   (otro puerto: BILLING_HTTP_PORT=8081 en .env)
#
# Los puertos se publican solo en 127.0.0.1. No usar esta configuración en un servidor público
# sin cambiar contraseñas y poner HTTPS delante (ver docs/DEPLOYMENT.md).

name: billing-platform

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local-superuser-change-me}
      BILLING_DB_NAME: billing
      BILLING_DB_OWNER_PASSWORD: ${BILLING_DB_OWNER_PASSWORD:-local-owner-change-me}
      BILLING_DB_APP_PASSWORD: ${BILLING_DB_APP_PASSWORD:-local-app-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/billing-init:ro
      - ./infrastructure/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    # Sin puerto publicado: el backend la alcanza por la red interna de Docker, así no choca
    # con un PostgreSQL instalado en el equipo ni queda expuesta. Para conectarte con una
    # herramienta externa, descomenta y usa un puerto libre:
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d billing"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    image: billing-platform-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BILLING_DB_URL: jdbc:postgresql://postgres:5432/billing
      BILLING_DB_OWNER_PASSWORD: ${BILLING_DB_OWNER_PASSWORD:-local-owner-change-me}
      BILLING_DB_APP_PASSWORD: ${BILLING_DB_APP_PASSWORD:-local-app-change-me}
      # Secreto de desarrollo; en cualquier otro entorno usar uno propio (openssl rand -base64 48).
      BILLING_JWT_SECRET: ${BILLING_JWT_SECRET:-bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMDEyMzQ1Njc4OQ==}
    ports:
      - "127.0.0.1:${BILLING_HTTP_PORT:-8080}:8080"

volumes:
  pgdata:
